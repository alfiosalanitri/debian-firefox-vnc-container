# Egress proxy for the sandboxed browser.
# Goal: the browser can reach the public Internet, but never the host, the
# Docker networks, the LAN or any VPN (e.g. Tailscale).

http_port 3128

# Destinations that must never be reachable. The "dst" ACL is checked against
# the resolved IP address, so it also catches public hostnames that resolve to
# private IPs (DNS rebinding style tricks).
# "this" network
acl blocked_dst dst 0.0.0.0/8
# private (RFC 1918)
acl blocked_dst dst 10.0.0.0/8
# carrier-grade NAT / Tailscale
acl blocked_dst dst 100.64.0.0/10
# loopback
acl blocked_dst dst 127.0.0.0/8
# link-local / cloud metadata
acl blocked_dst dst 169.254.0.0/16
# private (RFC 1918) / Docker networks
acl blocked_dst dst 172.16.0.0/12
# IETF protocol assignments
acl blocked_dst dst 192.0.0.0/24
# private (RFC 1918)
acl blocked_dst dst 192.168.0.0/16
# benchmarking
acl blocked_dst dst 198.18.0.0/15
# multicast
acl blocked_dst dst 224.0.0.0/4
# reserved / broadcast
acl blocked_dst dst 240.0.0.0/4
# unspecified / loopback
acl blocked_dst dst ::/128 ::1/128
# unique local (incl. Tailscale IPv6)
acl blocked_dst dst fc00::/7
# link-local
acl blocked_dst dst fe80::/10
# multicast
acl blocked_dst dst ff00::/8

# IPs explicitly listed in CUSTOM_HOSTS (generated at startup): the user chose
# to trust them, so they stay reachable even when private.
include /tmp/squid-custom-hosts.conf

# Squid cache manager is never reachable from the browser
http_access deny manager
http_access allow custom_hosts
http_access deny blocked_dst
http_access allow all

# Resolve names with the system hosts file + CUSTOM_HOSTS entries
hosts_file /tmp/hosts

# No disk cache, no state: everything lives in memory
cache deny all
cache_mem 16 MB
pid_filename none
netdb_filename none
pinger_enable off
coredump_dir /tmp

# Log every request to stdout: `make proxy-logs` shows which hosts a
# suspicious page contacts (for HTTPS only host:port of the CONNECT is known).
logformat sandbox %tl %>a %Ss/%>Hs %rm %ru %<a
access_log stdio:/dev/stdout sandbox
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0

# Do not reveal the proxy to the visited sites
via off
forwarded_for delete
httpd_suppress_version_string on
